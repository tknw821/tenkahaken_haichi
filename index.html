<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三方配置図ツール</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--line:#d9dde3;--tx:#1f2430;--sub:#6b7280;--pri:#1f6feb;--pri2:#e8f0fe;--warn:#e65100;--dan:#c62828}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px}
button:hover{background:#f0f2f5}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri:hover{background:#1a5fd0}
button.dan{color:var(--dan)}
button:disabled{opacity:.4;cursor:default}
input[type=text],input[type=url],input[type=number],select,textarea{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff;min-width:0}
textarea{width:100%;resize:vertical}
header#top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px}
header h1{font-size:16px;margin:0 8px 0 0}
.tabs{display:flex;gap:0}
.tabs button{border-radius:0;margin-left:-1px}
.tabs button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.tabs button:last-child{border-radius:0 6px 6px 0}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.sp{flex:1}
.badge{background:#fff3e0;color:var(--warn);border:1px solid #ffcc80;border-radius:99px;padding:2px 10px;font-weight:600}
main{padding:12px;max-width:1500px;margin:0 auto}
.layout{display:grid;grid-template-columns:360px 1fr;gap:12px;align-items:start}
#listPane{grid-column:1;grid-row:1}
#mapPane{grid-column:2;grid-row:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600;position:relative}
label.chk{display:inline-flex;align-items:center;gap:4px}
#mapSticky{background:var(--card)}
.mapwrap{text-align:center}
svg.map{width:100%;height:auto;max-height:76vh;display:block;margin:0 auto;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none;background:#fff;border-radius:8px}
svg.map text{pointer-events:none;font-family:inherit}
/* ズーム：ピンチ・ホイール・ボタン。拡大中はマップ枠内をスクロールして移動 */
.zwrap{position:relative}
.mapwrap.zoomed{overflow:auto;text-align:left}
.zbtns{position:absolute;top:6px;right:6px;display:flex;z-index:2;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.zbtns button{width:38px;height:36px;padding:0;border-radius:0;margin-left:-1px;background:rgba(255,255,255,.94);font-size:18px;font-weight:700;line-height:1}
.zbtns button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.zbtns button:last-child{border-radius:0 8px 8px 0}
.zbtns .zpct{width:auto;min-width:52px;font-size:12px;font-weight:600}
svg.map .cell polygon{stroke-linejoin:round}
svg.map .cell.empty polygon{fill:#eef0f4;stroke:#c8cdd6;stroke-width:1.5}
svg.map .cell.filled polygon{stroke:#fff;stroke-width:1.5}
svg.map .cell.sel polygon{stroke:#ff6d00;stroke-width:5;animation:blink 1s infinite}
svg.map .cell.drop polygon{stroke:#1976d2;stroke-width:5}
svg.map .cell.hl polygon{stroke:#ff6d00;stroke-width:4}
@keyframes blink{50%{stroke-opacity:.35}}
.lab{fill:#444;font-weight:700;text-anchor:middle}
.fr{fill:#c62828;text-anchor:middle;font-weight:700}
.bs{fill:#6b7280;text-anchor:middle;font-weight:600}
#infoBar{margin-top:8px;padding:8px 10px;border-radius:8px;background:#f0f4ff;border:1px solid #cfdcff;min-height:38px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#infoBar .grow{flex:1;min-width:150px}
.ibsel{display:inline-flex;align-items:center;justify-content:center;min-width:32px;min-height:32px;cursor:pointer}
.ibsel input{width:22px;height:22px;margin:0;accent-color:#ff6d00;cursor:pointer}
.ib-short{display:none}
@media(max-width:900px){.ib-short{display:inline}}
.side-h{font-weight:700;margin:2px 0 4px;text-align:center}
.mrow{display:flex;align-items:center;gap:8px;padding:5px 6px;border:1px solid transparent;border-bottom-color:#eef0f3;border-radius:6px;user-select:none;-webkit-user-select:none}
.mrow.sel{border-color:#ff6d00;background:#fff4e8}
.mrow.placed .pos{color:var(--sub)}
.mrow .grip{cursor:grab;color:#9aa0a8;padding:4px 6px;touch-action:none;font-size:16px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 6px;border-radius:5px;font-weight:700;font-size:13px;white-space:nowrap;border:1px solid rgba(0,0,0,.12)}
.mname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mname small{color:var(--sub);margin-left:6px}
.pos{font-size:12px}
#rows{max-height:52vh;overflow:auto}
details.card>summary{cursor:pointer;font-weight:600}
.stat{color:var(--sub);margin:6px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}
.dlg{background:#fff;border-radius:12px;padding:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.dlg h3{margin:0 0 8px}
.dbtn{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.dlg .f{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;margin:6px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;z-index:200;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none;display:flex;align-items:center;gap:10px}
#toast.on{opacity:.95}
body:has(.ov) #toast{bottom:auto;top:calc(var(--hdrH,46px) + 8px)}
#toast.has-btn{pointer-events:auto}
#toast button{background:#fff;color:#222;border:none;padding:4px 10px;border-radius:6px;font-size:12px;flex-shrink:0}
.ghost{position:fixed;z-index:150;pointer-events:none;transform:translate(-50%,-140%);opacity:.9}
.ghost .chip{height:34px;min-width:44px;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.bubble{position:fixed;z-index:120;background:#222;color:#fff;padding:6px 10px;border-radius:8px;transform:translate(-50%,-120%);pointer-events:none;font-size:13px;max-width:70vw}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#outSideSeg{display:none;margin-bottom:8px}
.note{background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:6px 10px;margin:8px 0;font-weight:600}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.legend .g{border:1px solid var(--line);border-radius:8px;padding:0 0 8px;background:#fff;overflow:hidden}
.legend .gh{display:flex;align-items:baseline;gap:8px;padding:7px 10px;margin-bottom:6px;border-left:6px solid var(--tc,#9aa0a6);background:#f3f4f6;font-weight:700;font-size:15px}
.legend .gh small{font-weight:400;color:var(--sub);font-size:12px}
.legend .it{display:flex;align-items:center;gap:8px;padding:2px 10px}
.memo{white-space:pre-wrap;margin:6px 0}
.title{font-size:20px;font-weight:700;margin:4px 0}
.urlbox{width:100%;font-size:12px}
.swatchbar{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.swatch{width:24px;height:24px;padding:0;border-radius:6px;border:2px solid transparent}
.swatch.on{border-color:#333;box-shadow:0 0 0 2px #fff inset}
.menuwrap{position:relative;display:inline-block}
.menu{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.18);z-index:60;display:flex;flex-direction:column;padding:4px;min-width:160px}
.menu button{text-align:left;border:none;border-radius:6px;padding:7px 10px}
.menu button:hover{background:#f0f2f5}
.bulkbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff4e8;border:1px solid #ffcc80;border-radius:8px;padding:6px 8px;margin:6px 0}
.mrow .bsel{margin-right:2px}
.rangewrap{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.rangewrap input[type=range]{width:100px}
#listHead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
#listHead .side-h{margin:0;text-align:left;flex:1}
.listToggleBtn{display:none}
#listPreview{display:none}
.listnote{margin:-2px 0 6px}
.hint{color:var(--sub);font-size:12px}
.previewchip{border:2px solid transparent;cursor:pointer}
.previewchip.placed{opacity:.55}
.previewchip.sel{border-color:#ff6d00;opacity:1}
.hsvbox{margin-top:6px}
.hsvrow{display:flex;align-items:center;gap:8px;margin:5px 0}
.hsvrow .hsvlab{width:32px;font-size:12px;color:var(--sub)}
.hsvrow input[type=range]{flex:1;height:22px}
.hsvrow input.hsvH{background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);border-radius:4px;-webkit-appearance:none;appearance:none}
.hsvrow input.hsvS{border-radius:4px;-webkit-appearance:none;appearance:none}
.hsvrow input.hsvV{border-radius:4px;-webkit-appearance:none;appearance:none}
.hsvval{width:30px;text-align:right;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.hsvpreview{width:100%;height:26px;border-radius:6px;border:1px solid var(--line);margin-top:4px}
.qrhint{color:var(--sub);font-size:12px;margin-top:6px}
.cplist{max-height:50vh;overflow:auto;margin-top:6px}
.cplist .mrow{cursor:pointer}
/* ヘッダー：保存状態・メニュー */
.icobtn{min-width:34px}
.savest{font-size:12px;color:#2e7d32;white-space:nowrap}
.savest.warn{color:var(--dan);font-weight:700}
.savest.flash{animation:svflash .8s}
@keyframes svflash{0%{opacity:.25}100%{opacity:1}}
.menu.right{left:auto;right:0;min-width:230px}
.menu.right button{white-space:nowrap}
.menu .mh{font-size:11px;color:var(--sub);padding:6px 10px 2px}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.menu button.dan{color:var(--dan)}
/* 初回案内 */
.onboard{border:2px dashed #b9c8ef;background:#f5f8ff;border-radius:10px;padding:14px;margin-bottom:10px;text-align:center}
.ob-step{display:inline-block;background:var(--pri);color:#fff;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;margin-bottom:4px}
.ob-h{font-size:17px;font-weight:700}
.ob-sub{color:var(--sub);margin:4px 0 12px}
.ob-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button.big{padding:10px 16px;font-weight:600;min-height:44px}
/* 表示設定 */
button.tg.on{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.cfgpanel{background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 8px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.sidehint{margin:-4px 0 6px}
/* 次へ */
.nextbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.nextbar .grow{flex:1;min-width:160px;color:var(--sub)}
/* 出力・共有 */
.viewbanner{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff3e0;border:1px solid #ffcc80;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.viewbanner .grow{flex:1;min-width:180px}
.outgrid{display:grid;grid-template-columns:1fr 320px;gap:12px;align-items:start}
#sharePanel{position:sticky;top:calc(var(--hdrH,52px) + 12px)}
.sec-h{margin:0 0 6px;font-size:16px}
.outhead{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.outhead .title{flex:1;min-width:0}
#shareBtn{width:100%}
.shl{font-size:12px;font-weight:700;color:var(--sub);margin:12px 0 4px;display:flex;gap:6px;align-items:baseline}
.shl:first-child{margin-top:4px}
.shl .hint{font-weight:400}
.urlrow{display:flex;gap:6px}
.urlrow input{flex:1;min-width:0;font-size:13px;background:#f8f9fb}
.cpbtn{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0}
.cpbtn svg{width:16px;height:16px;flex-shrink:0}
button.cpbtn.done{color:#2e7d32;border-color:#81c784;background:#e8f5e9}
#shortBtn{width:100%}
.shl .hint.over{color:var(--dan);font-weight:700}
.shl .rec{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7;border-radius:99px;padding:0 8px;font-size:11px;font-weight:700}
.qrtoggle{width:100%;margin-top:10px;color:var(--sub)}
.shortfb{margin-top:8px;padding:8px 10px;border:1px solid #f3c7c7;background:#fff7f7;border-radius:8px;display:flex;flex-direction:column;gap:6px}
.btnlink{display:block;width:100%;text-align:center;border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px 10px;color:var(--pri);font-weight:600;text-decoration:none}
#shareUrlBtn{width:100%;margin-top:10px}
#qrHost{text-align:center;margin-top:14px}
#qrHost canvas,#qrHost img{margin:0 auto}
/* メンバー表：チーム別表示 */
.tgroup{margin:4px 0 10px}
.tgh{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#f3f4f6;border-radius:8px;border-left:5px solid var(--tc,#9aa0a6);margin-bottom:2px}
.tgh .tname{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgh small{color:var(--sub);white-space:nowrap}
.tcolor{width:28px;height:28px;padding:0;border-radius:6px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);flex-shrink:0}
/* 色選び・メンバー編集（シート） */
.cp-head{display:flex;align-items:center;gap:10px}
.cp-now{width:64px;height:40px;border-radius:8px;border:1px solid var(--line);flex-shrink:0}
.cp-head input{width:120px}
.cp-sec{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-size:12px;color:var(--sub);font-weight:700}
.cp-sec .sp{flex:1}
.linkbtn{border:none;background:none;color:var(--pri);padding:2px 4px;font-size:13px}
.linkbtn:hover{background:none;text-decoration:underline}
.cp-pal{display:flex;flex-wrap:wrap;gap:7px}
.cp-pal .swatch{width:34px;height:34px}
.cp-pal.editing .swatch{outline:2px dashed #b0b6c0;outline-offset:1px}
.cp-editbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:8px;font-size:12px;color:var(--sub)}
.cp-opt{display:flex;gap:6px;align-items:flex-start;margin-top:12px;font-size:13px}
.me-color{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.colorbtn{display:inline-flex;align-items:center;gap:8px}
.dlg .f input[type=text]{width:100%}
.dbtn .sp{flex:1}
@media(max-width:900px){
 .layout{grid-template-columns:1fr}
 .layout{display:block}
 /* スマホ：マップ欄の枠を外し、固定表示のマップがメンバー表のスクロール中も残るようにする */
 #mapPane{display:contents}
 #listPane{margin-top:10px}
 #mapSticky{position:sticky;top:var(--hdrH,44px);z-index:20;padding-bottom:4px;box-shadow:0 4px 8px -6px rgba(0,0,0,.4)}
 svg.map{max-height:40vh}
 #infoBar{margin-top:4px;padding:6px 8px;min-height:0}
 .ib-long{display:none}
 #rows{max-height:none}
 .pair{grid-template-columns:1fr}
 main{padding:8px}
 .listToggleBtn{display:inline-flex}
 .outgrid{grid-template-columns:1fr}
 #listPane{scroll-margin-top:calc(var(--hdrH,46px) + 40vh + 56px)}
 .nextbar .grow{flex-basis:100%}
 .nextbar button{flex:1}
 #sharePanel{position:static;order:-1}
 body.viewing #sharePanel{order:2}
 #listPane.collapsed #listBody{display:none}
 #listPane.collapsed #listPreview{display:flex;flex-wrap:wrap;gap:5px;padding:2px 0 4px}
 /* スマホでタップしやすくする（C-1） */
 .mrow{padding:6px 6px}
 .mrow .grip,.mrow [data-act="edit"]{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0}
 .swatch{width:30px;height:30px}
 /* 閲覧画面を左右切替にする（C-3） */
 #outSideSeg{display:inline-flex}
 #outView[data-side="R"] .pair>div:first-child{display:none}
 #outView[data-side="L"] .pair>div:last-child{display:none}
}
@media(max-width:600px){
 header#top{gap:5px;padding:6px 8px;flex-wrap:nowrap}
 header h1{display:none}
 body.viewing header h1{display:block;font-size:15px}
 header#top button{font-size:13px;padding:6px 7px}
 header#top .icobtn{min-width:32px}
 .icobtn .lbl{display:none}
 .tabs{flex-shrink:0}
 .menuwrap{flex-shrink:0}
 .savest .lbl{display:none}
}
@media(max-width:600px){
 /* ダイアログは画面下からのシート表示 */
 .ov{align-items:flex-end;padding:0}
 .dlg{border-radius:14px 14px 0 0;max-height:88vh;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
 .outhead{flex-wrap:wrap}
 .outhead .title{flex-basis:100%}
}
</style>
</head>
<body>
<header id="top">
 <h1>三方配置図ツール</h1>
 <div class="tabs" id="tabs"><button data-mode="edit">作成</button><button data-mode="out">共有</button></div>
 <span class="badge" id="viewBadge" hidden>閲覧モード</span>
 <span class="sp"></span>
 <span class="savest" id="saveSt" title="編集内容はこのブラウザに自動保存されます">✓<span class="lbl"> 自動保存済み</span></span>
 <button id="undoBtn" class="icobtn" title="元に戻す (Ctrl+Z)">↶<span class="lbl"> 戻す</span></button>
 <button id="redoBtn" class="icobtn" title="やり直し (Ctrl+Y)">↷<span class="lbl"> やり直し</span></button>
 <div class="menuwrap" id="fileWrap">
  <button id="fileMenuBtn">ファイル ▾</button>
  <div id="fileMenu" class="menu right" hidden>
   <div class="mh">メンバー表を読み込む</div>
   <button type="button" data-act="file">CSVファイルを開く</button>
   <button type="button" data-act="paste">テキストを貼り付けて読込</button>
   <div class="mh">バックアップ</div>
   <button type="button" data-act="export">CSVで書き出し（保存）</button>
   <button type="button" data-act="text">テキストで書き出し（コピー用）</button>
   <hr>
   <button type="button" data-act="clear" class="dan">全配置クリア</button>
   <button type="button" data-act="new" class="dan">新しい配置図…</button>
  </div>
 </div>
</header>
<input type="file" id="fileIn" accept=".csv,.tsv,.txt,text/csv,text/plain" hidden>

<main id="editView">
 <div class="layout">
  <section id="mapPane" class="card">
   <div id="onboard" class="onboard" hidden>
    <div class="ob-h">まずはメンバーを登録しましょう</div>
    <div class="ob-sub">メンバー表を読み込むと、マップのマスに配置できるようになります。</div>
    <div class="ob-btns">
     <button type="button" class="pri big" data-act="file">CSVファイルを読込</button>
     <button type="button" class="big" data-act="paste">貼り付けで読込</button>
     <button type="button" class="big" data-act="add">＋ 1名ずつ追加</button>
    </div>
   </div>
   <div class="toolbar">
    <input type="text" id="title" placeholder="タイトル（例：9/28 三方戦）" style="flex:1;min-width:180px">
   </div>
   <div class="toolbar">
    <div class="seg" id="sideSeg"><button data-side="L">左陣地から見る</button><button data-side="R">右陣地から見る</button></div>
    <span class="sp"></span>
    <button id="viewCfgBtn" class="tg" aria-expanded="false">表示設定 ▾</button>
   </div>
   <div class="hint sidehint">左右は見た目が反転するだけで、配置は共通です。</div>
   <div class="cfgpanel" id="viewCfg" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
/* ============ 基本 ============ */
const LS_KEY='sanpo-haichi-v1', UI_KEY='sanpo-haichi-ui-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PAL=['#e57373','#64b5f6','#81c784','#ffb74d','#ba68c8','#4db6ac','#f06292','#a1887f','#dce775','#7986cb','#4dd0e1','#ff8a65'];
const PAL5=['#e57373','#64b5f6','#81c784','#ffb74d','#ba68c8'];
const GRAY='#9aa0a6';

const defaultState=()=>({v:1,title:'',memo:'',map:{rows:10,cols:10,parity:0,disabled:[]},members:[],teamColors:{},placements:{}});
let S=defaultState();
let mode='edit', viewing=false, editSide='L', sel=null;
let ui={label:'short',cols:true,filter:'all',sort:'input',q:'',fontScale:1,customColors:[],listCollapsed:false,cfgOpen:false,outSide:'L',listView:'list',uiv:2};
let undoStack=[], redoStack=[], idSeq=0;
let bulkMode=false, bulkSel=new Set();

const newId=()=>'m'+Date.now().toString(36)+(idSeq++).toString(36);
const normTeam=s=>String(s==null?'':s).normalize('NFKC').replace(/\s+/g,' ').trim();
const normName=s=>String(s==null?'':s).trim();

function saveLS(){
 if(viewing) return;
 let ok=true; try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){ok=false;}
 setSaveSt(ok);
}
function setSaveSt(ok){
 const el=$('#saveSt'); if(!el) return;
 el.classList.toggle('warn',!ok);
 el.innerHTML=ok?'✓<span class="lbl"> 自動保存済み</span>':'⚠<span class="lbl"> 保存できません</span>';
 el.title=ok?'編集内容はこのブラウザに自動保存されます':'ブラウザに保存できませんでした（プライベートモード等）。CSVで書き出してバックアップしてください';
 el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function saveUI(){ try{localStorage.setItem(UI_KEY,JSON.stringify(ui));}catch(e){} }
function loadLS(){
 try{const t=localStorage.getItem(UI_KEY); if(t) Object.assign(ui,JSON.parse(t)); ui.q='';}catch(e){}
 // 旧バージョンでは「メンバー表をたたむ」が初期値だったため、一度だけ展開状態に戻す
 if((ui.uiv||0)<2){ ui.listCollapsed=false; ui.uiv=2; saveUI(); }
 try{const t=localStorage.getItem(LS_KEY); if(t){ S=sanitize(JSON.parse(t)); }}catch(e){}
}

function sanitize(o){
 const s=defaultState();
 if(!o||typeof o!=='object') return s;
 s.title=String(o.title||''); s.memo=String(o.memo||'');
 const m=o.map||{};
 s.map.rows=clamp(parseInt(m.rows)||10,2,30); s.map.cols=clamp(parseInt(m.cols)||10,2,30);
 s.map.parity=m.parity===1?1:0;
 s.map.disabled=Array.isArray(m.disabled)?m.disabled.map(String):[];
 const seen=new Set();
 (Array.isArray(o.members)?o.members:[]).forEach(x=>{
  if(!x) return; const name=normName(x.name); if(!name||seen.has(name)) return; seen.add(name);
  s.members.push({id:String(x.id||newId()),name,team:normTeam(x.team),short:String(x.short||'').trim(),color:String(x.color||'').trim()});
 });
 if(o.teamColors&&typeof o.teamColors==='object') for(const k in o.teamColors){ if(toHex(o.teamColors[k])) s.teamColors[normTeam(k)]=o.teamColors[k]; }
 const ids=new Set(s.members.map(m=>m.id)), used=new Set();
 if(o.placements&&typeof o.placements==='object') for(const k in o.placements){
  const id=o.placements[k]; if(ids.has(id)&&!used.has(id)&&isCellIn(s,k)){ s.placements[k]=id; used.add(id); }
 }
 return s;
}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}

/* ============ マップ幾何 ============ */
function isCellIn(s,key){
 const [r,c]=key.split(',').map(Number); const m=s.map;
 return Number.isInteger(r)&&Number.isInteger(c)&&r>=0&&c>=0&&r<m.rows&&c<m.cols&&((r+c)%2===m.parity)&&!m.disabled.includes(key);
}
function allCells(s=S){
 const a=[]; for(let r=0;r<s.map.rows;r++)for(let c=0;c<s.map.cols;c++) if((r+c)%2===s.map.parity) a.push({r,c,key:r+','+c});
 return a;
}
const validCells=(s=S)=>allCells(s).filter(x=>!s.map.disabled.includes(x.key));
const memberById=id=>S.members.find(m=>m.id===id);
const placementOf=id=>Object.keys(S.placements).find(k=>S.placements[k]===id)||null;

/* ============ 表示名・色 ============ */
function defShort(name){
 let out='',b=0;
 for(const ch of Array.from(name)){
  const c=ch.codePointAt(0);
  const w=((c>=0x20&&c<=0x7e)||(c>=0xff61&&c<=0xff9f))?1:2;
  if(b+w>2) break; out+=ch; b+=w;
 }
 return out;
}
const shortOf=m=>m.short||defShort(m.name);
const cctx=document.createElement('canvas').getContext('2d');
const ccache={};
function toHex(v){
 if(!v) return null; v=String(v).trim(); if(!v) return null;
 if(v in ccache) return ccache[v];
 cctx.fillStyle='#010203'; cctx.fillStyle=v;
 let h=cctx.fillStyle;
 if(h==='#010203'&&v.toLowerCase().replace(/\s/g,'')!=='#010203'&&v.toLowerCase()!=='#123'){ return ccache[v]=null; }
 if(h[0]!=='#'){const n=h.match(/\d+/g); if(!n) return ccache[v]=null; h='#'+n.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join('');}
 return ccache[v]=h;
}
function addCustomColor(hex){
 hex=toHex(hex); if(!hex) return;
 if(PAL5.includes(hex)||ui.customColors.includes(hex)) return;
 ui.customColors.unshift(hex);
 if(ui.customColors.length>24) ui.customColors.length=24;
 saveUI();
}
function paletteColors(){ return PAL5.concat(ui.customColors); }
function hsv2hex(h,s,v){
 s/=100; v/=100;
 const k=n=>(n+h/60)%6;
 const f=n=>v-v*s*Math.max(0,Math.min(k(n),4-k(n),1));
 const r=Math.round(f(5)*255),g=Math.round(f(3)*255),b=Math.round(f(1)*255);
 return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function hex2hsv(hex){
 hex=toHex(hex)||'#ff0000';
 const n=parseInt(hex.slice(1),16), r=(n>>16)/255, g=((n>>8)&255)/255, b=(n&255)/255;
 const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
 let h=0;
 if(d!==0){
  if(max===r) h=60*(((g-b)/d)%6);
  else if(max===g) h=60*((b-r)/d+2);
  else h=60*((r-g)/d+4);
 }
 if(h<0) h+=360;
 const s=max===0?0:d/max;
 return {h:Math.round(h),s:Math.round(s*100),v:Math.round(max*100)};
}
function updateHsvBoxUI(root){
 const h=+root.querySelector('.hsvH').value, s=+root.querySelector('.hsvS').value, v=+root.querySelector('.hsvV').value;
 root.querySelectorAll('.hsvrow').forEach(row=>{ row.querySelector('.hsvval').textContent=row.querySelector('input').value; });
 root.querySelector('.hsvS').style.background=`linear-gradient(to right,#fff,${hsv2hex(h,100,v||100)})`;
 root.querySelector('.hsvV').style.background=`linear-gradient(to right,#000,${hsv2hex(h,s,100)})`;
 const pv=root.querySelector('.hsvpreview'); if(pv) pv.style.background=hsv2hex(h,s,v);
}
function teamOrder(){const a=[];S.members.forEach(m=>{if(m.team&&!a.includes(m.team)) a.push(m.team);});return a;}
function memberColor(m){
 return toHex(m.color)||toHex(S.teamColors[m.team])||teamColor(m.team);
}
function teamColor(t){
 if(!t) return GRAY;
 const c=toHex(S.teamColors[t]); if(c) return c;
 return PAL[teamOrder().indexOf(t)%PAL.length];
}
function textColor(hex){
 const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
 return (0.299*r+0.587*g+0.114*b)/255>0.62?'#1b1b1b':'#fff';
}

/* ============ Undo ============ */
function snap(){undoStack.push(JSON.stringify(S)); if(undoStack.length>80) undoStack.shift(); redoStack=[];}
function mutate(fn){ snap(); fn(); cleanup(); saveLS(); renderAll(); }
function cleanup(){
 const ids=new Set(S.members.map(m=>m.id)), used=new Set();
 for(const k of Object.keys(S.placements)){
  const id=S.placements[k];
  if(!ids.has(id)||used.has(id)||!isCellIn(S,k)) delete S.placements[k]; else used.add(id);
 }
 if(sel&&!ids.has(sel)) sel=null;
 for(const id of [...bulkSel]) if(!ids.has(id)) bulkSel.delete(id);
 for(const t of Object.keys(S.teamColors)) if(!S.members.some(m=>m.team===t)) delete S.teamColors[t];
}
function undo(){ if(viewing||!undoStack.length) return; redoStack.push(JSON.stringify(S)); S=JSON.parse(undoStack.pop()); cleanup(); saveLS(); renderAll(); }
function redo(){ if(viewing||!redoStack.length) return; undoStack.push(JSON.stringify(S)); S=JSON.parse(redoStack.pop()); cleanup(); saveLS(); renderAll(); }

/* ============ 配置操作 ============ */
function place(mid,key){
 if(!isCellIn(S,key)||!memberById(mid)) return;
 const occ=S.placements[key]; if(occ===mid) return;
 const prev=placementOf(mid);
 const mName=memberById(mid).name, occName=occ&&memberById(occ)?memberById(occ).name:null;
 mutate(()=>{
  if(prev) delete S.placements[prev];
  if(occ&&prev) S.placements[prev]=occ;
  S.placements[key]=mid;
 });
 if(occ&&prev&&occName) toast(`${mName} と ${occName} を入れ替えました`,{undo:true});
}
function unplace(mid){
 const k=placementOf(mid); if(!k) return;
 const m=memberById(mid);
 mutate(()=>{delete S.placements[k];});
 if(m) toast(`${m.name} を配置から外しました`,{undo:true});
}

/* ============ ダイアログ・トースト ============ */
function dialog({title,body,buttons}){
 return new Promise(res=>{
  const ov=document.createElement('div'); ov.className='ov';
  const dl=document.createElement('div'); dl.className='dlg'; dl.setAttribute('role','dialog');
  const h=document.createElement('h3'); h.textContent=title||''; dl.appendChild(h);
  const b=document.createElement('div');
  if(typeof body==='string') b.innerHTML=body; else if(body) b.appendChild(body);
  dl.appendChild(b);
  const bt=document.createElement('div'); bt.className='dbtn';
  const done=v=>{ov.remove();document.removeEventListener('keydown',kd,true);res(v);};
  (buttons||[{t:'OK',v:true,cls:'pri'}]).forEach(x=>{
   const e=document.createElement('button'); e.textContent=x.t; if(x.cls) e.className=x.cls; e.onclick=()=>done(x.v); bt.appendChild(e);
  });
  dl.appendChild(bt); ov.appendChild(dl); document.body.appendChild(ov);
  const kd=e=>{if(e.key==='Escape'&&isTopOv(ov)){e.stopPropagation();done(null);}};
  document.addEventListener('keydown',kd,true);
  const f=dl.querySelector('input,textarea'); if(f) f.focus();
 });
}
function isTopOv(ov){ const a=document.querySelectorAll('.ov'); return a[a.length-1]===ov; }
// 汎用シート（スマホでは画面下から表示）。close() で閉じ、onclose を呼ぶ
function sheet(title){
 const ov=document.createElement('div'); ov.className='ov';
 const dl=document.createElement('div'); dl.className='dlg'; dl.setAttribute('role','dialog');
 dl.innerHTML=`<h3>${esc(title)}</h3>`;
 ov.appendChild(dl); document.body.appendChild(ov);
 const kd=e=>{ if(e.key==='Escape'&&isTopOv(ov)){ e.stopPropagation(); api.close(); } };
 document.addEventListener('keydown',kd,true);
 ov.addEventListener('click',e=>{ if(e.target===ov) api.close(); });
 const api={ov,dl,onclose:null,close(){
  if(!ov.isConnected) return;
  ov.remove(); document.removeEventListener('keydown',kd,true);
  if(api.onclose) api.onclose();
 }};
 return api;
}

/* ============ 色選び ============ */
// 戻り値：{color:'#rrggbb' または ''（リセット）, checked} / キャンセル時 null
// スライダーはプレビューだけを変え、「この色にする」を押したときに確定・パレットへ保存する
function openColorPicker({title,current,resetLabel,note,option}){
 return new Promise(res=>{
  const sh=sheet(title||'色を選ぶ'); let result=null;
  sh.onclose=()=>res(result);
  let cur=toHex(current)||PAL5[0], editMode=false, editIdx=-1;
  const body=document.createElement('div'); sh.dl.appendChild(body);
  body.innerHTML=
   '<div class="cp-head"><div class="cp-now"></div><input type="text" class="cp-hex" aria-label="カラーコード"></div>'+
   (note?`<div class="hint" style="margin-top:6px">${note}</div>`:'')+
   '<div class="cp-sec">基本の色</div><div class="cp-pal" data-k="base"></div>'+
   '<div class="cp-sec">カスタムカラー<span class="sp"></span><button type="button" class="linkbtn cp-edit">編集</button></div>'+
   '<div class="cp-pal" data-k="cust"></div><div class="cp-editbar" hidden></div>'+
   '<div class="cp-sec">色を調整</div><div class="hsvbox">'+
    '<div class="hsvrow"><span class="hsvlab">色相</span><input type="range" class="hsvH" min="0" max="360"><span class="hsvval"></span></div>'+
    '<div class="hsvrow"><span class="hsvlab">彩度</span><input type="range" class="hsvS" min="0" max="100"><span class="hsvval"></span></div>'+
    '<div class="hsvrow"><span class="hsvlab">明度</span><input type="range" class="hsvV" min="0" max="100"><span class="hsvval"></span></div>'+
   '</div>'+
   (option?`<label class="cp-opt"><input type="checkbox" class="cp-chk"${option.checked?' checked':''}><span>${option.label}</span></label>`:'')+
   '<div class="dbtn"><button type="button" data-b="cancel">キャンセル</button>'+
   (resetLabel?`<button type="button" data-b="reset">${resetLabel}</button>`:'')+
   '<button type="button" class="pri" data-b="ok">この色にする</button></div>';
  const hsvRoot=body.querySelector('.hsvbox'), hexIn=body.querySelector('.cp-hex');
  const setSliders=hex=>{ const v=hex2hsv(hex); hsvRoot.querySelector('.hsvH').value=v.h; hsvRoot.querySelector('.hsvS').value=v.s; hsvRoot.querySelector('.hsvV').value=v.v; updateHsvBoxUI(hsvRoot); };
  function draw(){
   body.querySelector('.cp-now').style.background=cur;
   if(document.activeElement!==hexIn) hexIn.value=cur;
   body.querySelector('[data-k="base"]').innerHTML=PAL5.map(h=>`<button type="button" class="swatch${h===cur?' on':''}" data-color="${h}" style="background:${h}" title="${h}"></button>`).join('');
   const cust=body.querySelector('[data-k="cust"]');
   cust.classList.toggle('editing',editMode);
   cust.innerHTML=ui.customColors.length?ui.customColors.map((h,i)=>`<button type="button" class="swatch${(editMode?i===editIdx:h===cur)?' on':''}" data-color="${h}" data-i="${i}" style="background:${h}" title="${h}"></button>`).join(''):
    '<span class="hint">スライダーで作った色は「この色にする」を押すとここに保存されます。</span>';
   const eb=body.querySelector('.cp-edit'); eb.hidden=!ui.customColors.length&&!editMode; eb.textContent=editMode?'完了':'編集';
   const bar=body.querySelector('.cp-editbar'); bar.hidden=!editMode;
   bar.innerHTML=editIdx<0?'調整・削除したい色をタップしてください':
    '<button type="button" data-b="over">調整した色で上書き</button><button type="button" class="dan" data-b="delc">この色を削除</button><span>スライダーで調整してから上書きできます</span>';
  }
  setSliders(cur); draw();
  body.addEventListener('input',e=>{
   if(!e.target.closest('.hsvbox')) return;
   updateHsvBoxUI(hsvRoot);
   const h=+hsvRoot.querySelector('.hsvH').value, sa=+hsvRoot.querySelector('.hsvS').value, v=+hsvRoot.querySelector('.hsvV').value;
   cur=hsv2hex(h,sa,v); draw();
  });
  hexIn.addEventListener('change',()=>{ const h=toHex(hexIn.value); if(!h){ toast('色を認識できません（例：#ff8800）'); hexIn.value=cur; return; } cur=h; setSliders(cur); draw(); });
  body.addEventListener('click',e=>{
   const sw=e.target.closest('.swatch');
   if(sw){

/* ============ SVG描画 ============ */
function tw(s){let w=0;for(const ch of s){const c=ch.codePointAt(0);w+=((c>=0x20&&c<=0x7e)||(c>=0xff61&&c<=0xff9f))?0.58:1;}return w;}
let _fs=1;
function fit(s,maxW,maxFs,d,twoOK){
 const ch=Array.from(s); let lines=[s];
 if(twoOK&&ch.length>2&&tw(s)>2.2){const h=Math.ceil(ch.length/2);lines=[ch.slice(0,h).join(''),ch.slice(h).join('')];}
 if(lines.length===2) maxFs=Math.min(maxFs,0.42*d*_fs);
 const mw=Math.max(...lines.map(tw),0.5);
 return {lines,fs:Math.min(maxFs,maxW/mw)};
}
function txt(lines,fs,x,y,fg,extra=''){
 const n=lines.length;
 return `<text x="${x}" y="${y}" font-size="${fs.toFixed(1)}" fill="${fg}" text-anchor="middle" dominant-baseline="central" font-weight="700" ${extra}>`+
  lines.map((l,i)=>`<tspan x="${x}" y="${(y+(i-(n-1)/2)*fs*1.1).toFixed(1)}">${esc(l)}</tspan>`).join('')+'</text>';
}
function cellLabel(m,x,y,d,fg){
 const short=shortOf(m); const mode=ui.label;
 if(mode==='team'){ if(!m.team) return ''; const f=fit(m.team,1.5*d,0.62*d*_fs,d,true); return txt(f.lines,f.fs,x,y,fg); }
 if(mode==='both'&&m.team){
  const a=fit(short,1.4*d,0.5*d*_fs,d,false);
  let t=Array.from(m.team); if(t.length>4) t=t.slice(0,3).concat('…');
  const b=fit(t.join(''),0.85*d,0.3*d*_fs,d,false);
  return txt(a.lines,a.fs,x,y-0.2*d,fg)+txt(b.lines,b.fs,x,y+0.5*d,fg,'opacity=".85"');
 }
 const f=fit(short,1.5*d,0.62*d*_fs,d,true); return txt(f.lines,f.fs,x,y,fg);
}
function mapSVG(mirror,o={}){
 const {rows:R,cols:C}=S.map, d=36, M=84;
 _fs=ui.fontScale||1;
 const disSet=new Set(S.map.disabled);
 const all=allCells();
 const shown=all.filter(x=>!disSet.has(x.key));
 const xmax=(R+C-2)*d, ymin=-(C-1)*d, ymax=(R-1)*d;
 const vx=-d-M, vw=xmax+2*d+2*M, vy=ymin-d-26, vh=(ymax-ymin)+2*d+60;
 const X=x=>mirror?xmax-x:x;
 let out=`<svg class="map" viewBox="${vx} ${vy} ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" data-mirror="${mirror?1:0}">`;
 if(!shown.length) return out+`<text x="${vx+vw/2}" y="0" text-anchor="middle" font-size="20" fill="#888">有効なマスがありません</text></svg>`;
 // 列番号
 if(ui.cols){
  const kmax=Math.max(...all.map(x=>x.r+x.c)), cols={};
  shown.forEach(x=>{
   const k=x.r+x.c, y=(x.r-x.c)*d;
   const e=cols[k]||(cols[k]={min:y,max:y}); e.min=Math.min(e.min,y); e.max=Math.max(e.max,y);
  });
  const labFs=(16*_fs).toFixed(1);
  for(const k in cols){
   const n=(kmax-k)/2+1, x=X(k*d);
   out+=`<text class="lab" font-size="${labFs}" x="${x}" y="${cols[k].min-d-6}">${n}</text><text class="lab" font-size="${labFs}" x="${x}" y="${cols[k].max+d+17}">${n}</text>`;
  }
 }
 // 前線・本陣
 const midY=(ymin+ymax)/2, frontX=mirror?vx+M/2:xmax+d+M/2, baseX=mirror?xmax+d+M/2:vx+M/2;
 out+=`<text class="fr" x="${frontX}" y="${midY-8}" font-size="${(30*_fs).toFixed(1)}">${mirror?'◀':'▶'}</text>`+
  `<text class="fr" x="${frontX}" y="${midY+20}" font-size="${(17*_fs).toFixed(1)}">前線</text><text class="fr" x="${frontX}" y="${midY+38}" font-size="${(12*_fs).toFixed(1)}">マップ中央</text>`+
  `<text class="bs" x="${baseX}" y="${midY}" font-size="${(16*_fs).toFixed(1)}">本陣側</text>`;
 // マス
 const selKey=(!o.static&&sel)?placementOf(sel):null;
 for(const cl of shown){
  const x=X((cl.r+cl.c)*d), y=(cl.r-cl.c)*d, pts=`${x},${y-d} ${x+d},${y} ${x},${y+d} ${x-d},${y}`;
  const mid=S.placements[cl.key], m=mid&&memberById(mid);
  let cls='cell', fill='', inner='', tip='';
  if(m){
   const col=memberColor(m); cls+=' filled'+(cl.key===selKey?' sel':'');
   fill=` fill="${col}"`; inner=cellLabel(m,x,y,d,textColor(col));
   tip=`<title>${esc(m.name)}（チーム: ${esc(m.team||'なし')} / 表示名: ${esc(shortOf(m))}）</title>`;
  } else cls+=' empty';
  out+=`<g class="${cls}" data-key="${cl.key}">${tip}<polygon points="${pts}"${fill}/>${inner}</g>`;
 }
 return out+'</svg>';
}

/* ============ マップのズーム ============ */
const ZMIN=1, ZMAX=4, ZSTEP=1.25;
const zoom={edit:1,out:1}; // 作成画面／共有画面（左右共通）の倍率
const zoomWraps=k=>k==='edit'?[$('#mapHost')]:[$('#mapL'),$('#mapR')];
// 倍率 z でマップを描く。枠の高さは等倍時の高さに固定し、枠内をスクロールして移動する
function sizeMap(wrap,z){
 const svg=wrap.querySelector('svg.map'); if(!svg) return;
 svg.style.width=svg.style.height=svg.style.maxWidth=svg.style.maxHeight=''; wrap.style.height='';
 wrap.classList.remove('zoomed');
 if(z<=1) return;
 const r=svg.getBoundingClientRect(); if(!r.width) return; // 非表示中は等倍のまま
 wrap.style.height=r.height+'px'; wrap.classList.add('zoomed');
 svg.style.maxWidth=svg.style.maxHeight='none';
 svg.style.width=r.width*z+'px'; svg.style.height=r.height*z+'px';
}
// (ax,ay)＝枠内の基準点。そこが動かないように拡大縮小する（省略時は中央）
function applyZoom(wrap,z,oldZ,ax,ay){
 const sl=wrap.scrollLeft, st=wrap.scrollTop;
 if(ax==null){ ax=wrap.clientWidth/2; ay=wrap.clientHeight/2; }
 sizeMap(wrap,z);
 const k=z/oldZ; wrap.scrollLeft=(sl+ax)*k-ax; wrap.scrollTop=(st+ay)*k-ay;
}
function setMapHTML(wrap,html,k){
 const sl=wrap.scrollLeft, st=wrap.scrollTop;
 wrap.innerHTML=html; sizeMap(wrap,zoom[k]);
 wrap.scrollLeft=sl; wrap.scrollTop=st;
 updZoomUI(k);
}
function setZoom(k,z,src,ax,ay){
 z=clamp(Math.round(z*100)/100,ZMIN,ZMAX); const old=zoom[k]; if(z===old) return;
 zoom[k]=z;
 zoomWraps(k).forEach(w=>applyZoom(w,z,old,w===src?ax:null,w===src?ay:null));
 updZoomUI(k);
}
function updZoomUI(k){
 document.querySelectorAll(`.zbtns[data-zk="${k}"]`).forEach(g=>{
  g.querySelector('.zpct').textContent=Math.round(zoom[k]*100)+'%';
  g.querySelector('[data-z=out]').disabled=zoom[k]<=ZMIN; g.querySelector('[data-z=in]').disabled=zoom[k]>=ZMAX;
 });
}
function bindZoom(wrap,k){
 // マウスホイール（トラックパッドのピンチも含む）
 wrap.addEventListener('wheel',e=>{
  e.preventDefault(); const r=wrap.getBoundingClientRect();
  setZoom(k,zoom[k]*Math.exp(-e.deltaY*(e.deltaMode===1?0.05:0.0018)),wrap,e.clientX-r.left,e.clientY-r.top);
 },{passive:false});
 // 2本指ピンチ
 let p0=null;
 const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
 wrap.addEventListener('touchstart',e=>{ if(e.touches.length===2) p0={d:dist(e.touches)||1,z:zoom[k]}; },{passive:true});
 wrap.addEventListener('touchmove',e=>{
  if(!p0||e.touches.length!==2) return;
  e.preventDefault(); const r=wrap.getBoundingClientRect();
  setZoom(k,p0.z*dist(e.touches)/p0.d,wrap,(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,(e.touches[0].clientY+e.touches[1].clientY)/2-r.top);
 },{passive:false});
 wrap.addEventListener('touchend',e=>{ if(e.touches.length<2) p0=null; });
}

function b64e(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)));}
function encodeState(){
 const idx={}; S.members.forEach((m,i)=>idx[m.id]=i);
 const a=[1,S.title,S.memo,[S.map.rows,S.map.cols,S.map.parity,S.map.disabled],
  S.members.map(m=>[m.name,m.team,m.short,m.color]),Object.entries(S.teamColors),
  Object.entries(S.placements).map(([k,id])=>{const [r,c]=k.split(',');return [+r,+c,idx[id]];})];
 const j=JSON.stringify(a);
 return (window.LZString?'1.'+LZString.compressToEncodedURIComponent(j):'0.'+b64e(j));
}
function decodeState(str){
 const t=str.slice(0,2), body=str.slice(2);
 let j; if(t==='1.'){ if(!window.LZString) throw new Error('lz'); j=LZString.decompressFromEncodedURIComponent(body); } else if(t==='0.') j=b64d(body); else throw new Error('fmt');
 const a=JSON.parse(j); if(!Array.isArray(a)) throw new Error('bad');
 const members=a[4].map((x,i)=>({id:'m'+i,name:x[0],team:x[1],short:x[2],color:x[3]}));
 const tc={}; (a[5]||[]).forEach(([k,v])=>tc[k]=v);
 const pl={}; (a[6]||[]).forEach(([r,c,i])=>{if(members[i]) pl[r+','+c]=members[i].id;});
 const st=sanitize({title:a[1],memo:a[2],map:{rows:a[3][0],cols:a[3][1],parity:a[3][2],disabled:a[3][3]},members,teamColors:tc,placements:pl});
 return st;
}

function dataUrlToBlob(dataUrl){

}

function saveOrShareBlob(blob,filename){

  navigator.share({files:[file]}).catch(e=>{ if(e&&e.name==='AbortError') return; downloadBlob(blob,filename); });

function savePng(canvas,filename){

}

/* ============ CSV ============ */
function parseTable(text){
 text=text.replace(/^﻿/,'').replace(/\r\n?/g,'\n');
 const delims=text.includes('\t')?new Set(['\t']):new Set([',','，','、','。']);
 const rows=[]; let row=[],cur='',q=false;
 for(let i=0;i<text.length;i++){
  const ch=text[i];
  if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
  else if(ch==='"'&&cur==='') q=true;
  else if(delims.has(ch)){row.push(cur);cur='';}
  else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
  else cur+=ch;
 }
 row.push(cur); rows.push(row);
 return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function readEntries(text){
 const rows=parseTable(text); if(!rows.length) return {entries:[],dups:0};
 const RE={name:/^(メンバー名?|名前|氏名|name|ゲーム内名)$/i,team:/^(チーム|team|班)$/i,short:/^表示名?$/,color:/^(表示カラー|カラー|色|color)$/i,place:/^配置$/};
 const head=rows[0].map(c=>c.trim());
 const isHead=head.some(c=>Object.values(RE).some(re=>re.test(c)));
 let ix={name:0,team:1,short:2,color:3,place:4};
 if(isHead){ ix={name:0}; for(const k in RE){const i=head.findIndex(c=>RE[k].test(c)); if(i>=0) ix[k]=i;} rows.shift(); }
 const map=new Map(); let dups=0;
 for(const r of rows){
  const name=normName(r[ix.name]); if(!name) continue;
  const g=k=>ix[k]===undefined?undefined:(r[ix[k]]||'').trim();
  const e={name,team:normTeam(g('team')),short:g('short')||'',color:g('color')||'',place:g('place')||''};
  if(map.has(name)) dups++;
  map.set(name,e);
 }
 return {entries:[...map.values()],dups};
}
async function importText(text){
 const {entries,dups}=readEntries(text);
 if(!entries.length){toast('読み込めるメンバーがありませんでした');return;}
 let modeSel='replace';
 if(S.members.length){
  const names=new Set(entries.map(e=>e.name));
  const lost=S.members.filter(m=>!names.has(m.name)&&placementOf(m.id)).length;
  const r=await dialog({title:'メンバー表の再読込',body:`<div>現在 ${S.members.length}名が登録されています。読み込み ${entries.length}名。</div><div class="stat">追加・更新：同名は属性を上書き（配置は維持）、新規は追加。<br>置き換え：表を入れ替え。新しい表に無いメンバーの配置は解除されます（<b>${lost}名</b>）。</div>`,
   buttons:[{t:'キャンセル',v:null},{t:'追加・更新',v:'merge',cls:'pri'},{t:`置き換え（${lost}名解除）`,v:'replace',cls:'pri dan'}]});
  if(!r) return; modeSel=r;
 }
 mutate(()=>{
  const by=new Map(S.members.map(m=>[m.name,m]));
  if(modeSel==='replace'){ const names=new Set(entries.map(e=>e.name)); S.members=S.members.filter(m=>names.has(m.name)); }
  const order=[];
  for(const e of entries){
   let m=by.get(e.name);
   if(!m||!S.members.includes(m)){ m={id:newId(),name:e.name,team:'',short:'',color:''}; S.members.push(m); }
   if(modeSel==='replace'||e.team||!m.team) m.team=e.team;
   if(modeSel==='replace'||e.short) m.short=e.short;
   if(modeSel==='replace'||e.color) m.color=e.color;
   order.push([m,e]);
  }
  if(modeSel==='replace'){ const rank=new Map(entries.map((e,i)=>[e.name,i])); S.members.sort((a,b)=>rank.get(a.name)-rank.get(b.name)); }
  for(const [m,e] of order){
   const mm=/^(\d+)\s*[,，]\s*(\d+)$/.exec(e.place); if(!mm) continue;
   const key=+mm[1]+','+ +mm[2]; if(!isCellIn(S,key)) continue;
   const prev=placementOf(m.id); if(prev) delete S.placements[prev];
   S.placements[key]=m.id;
  }
 });
 toast(`${entries.length}名を読み込みました`+(dups?`（重複${dups}件を統合）`:''));
}

function csvFilename(){
 const d=new Date(), ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
 const safe=(S.title||'').trim().replace(/[\\/:*?"<>|]/g,'_');

function memberTable(quoteAll){
 // quoteAll=false のときは、区切り文字などを含む項目だけ "" で囲む（メモ帳で読みやすくするため）
 const q=v=>{ v=String(v); return (quoteAll||/[",\n、，。\t]/.test(v))?'"'+v.replace(/"/g,'""')+'"':v; };
 return ['メンバー名,チーム,表示名,カラー,配置'].concat(S.members.map(m=>[m.name,m.team,m.short,m.color,placementOf(m.id)||''].map(q).join(',')));

/* ============ ポインタ操作（ドラッグ／タップ） ============ */
let drag=null;
function startGhost(){
 const m=memberById(drag.mid); if(!m) return;
 const g=document.createElement('div'); g.className='ghost'; const c=memberColor(m);
 g.innerHTML=`<span class="chip" style="background:${c};color:${textColor(c)}">${esc(shortOf(m))}</span>`;
 document.body.appendChild(g); drag.ghost=g; drag.active=true; moveGhost(drag.x,drag.y);
 if(drag.touch) navigator.vibrate?.(15);
}
function moveGhost(x,y){ if(drag.ghost){drag.ghost.style.left=x+'px';drag.ghost.style.top=y+'px';} }
function cellAt(x,y){ const e=document.elementFromPoint(x,y); return e&&e.closest?e.closest('#mapHost [data-key]'):null; }
function clearDrop(){document.querySelectorAll('#mapHost .drop').forEach(e=>e.classList.remove('drop'));}
function endDrag(){ if(!drag) return; clearTimeout(drag.timer); if(drag.ghost) drag.ghost.remove(); clearDrop(); drag=null; }

let touchPts=0, multiTouch=false; // ピンチ中の指をタップ・ドラッグとして扱わない
document.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch'){ touchPts++; if(touchPts>1){ multiTouch=true; endDrag(); return; } }
 if(viewing||mode!=='edit'||(e.pointerType==='mouse'&&e.button!==0)) return;
 if(e.target.closest('input,button,select,textarea,.ov')) return;
 if(drag) endDrag();
 const cell=e.target.closest('#mapHost [data-key]'), row=e.target.closest('.mrow');
 let d=null;
 if(cell){ const key=cell.dataset.key; d={kind:'cell',key,mid:S.placements[key]||null}; }
 else if(row) d={kind:'row',mid:row.dataset.mid,grip:!!e.target.closest('.grip')};
 else if(e.target.closest('#mapHost')) d={kind:'blank'};
 else return;
 d.id=e.pointerId; d.sx=d.x=e.clientX; d.sy=d.y=e.clientY; d.touch=e.pointerType!=='mouse'; d.active=false;
 if((d.kind==='row'&&d.touch&&!d.grip&&!bulkMode)||(d.kind==='cell'&&d.mid&&d.touch)) d.timer=setTimeout(()=>{ if(drag===d&&!d.active) startGhost(); },380);
 drag=d;
});
document.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.id) return;
 drag.x=e.clientX; drag.y=e.clientY;
 const dist=Math.hypot(drag.x-drag.sx,drag.y-drag.sy);
 if(!drag.active){
  if(drag.kind==='blank'||(drag.kind==='cell'&&!drag.mid)){ if(dist>8) drag.tapCancel=true; return; }
  if((drag.kind==='row'&&!drag.grip||drag.kind==='cell')&&drag.touch){ if(dist>8){clearTimeout(drag.timer);drag.tapCancel=true;} return; }
  if(drag.kind==='row'&&bulkMode){ if(dist>8) drag.tapCancel=true; return; }
  if(dist>5) startGhost();
  return;
 }
 moveGhost(drag.x,drag.y);
 clearDrop(); const c=cellAt(drag.x,drag.y); if(c) c.classList.add('drop');
});
document.addEventListener('touchmove',e=>{ if(drag&&drag.active&&e.cancelable) e.preventDefault(); },{passive:false});
function touchUp(e){
 if(e.pointerType!=='touch') return false;
 touchPts=Math.max(0,touchPts-1);
 if(multiTouch){ endDrag(); if(!touchPts) multiTouch=false; return true; }
 return false;
}
document.addEventListener('pointercancel',e=>{ touchUp(e); if(drag&&e.pointerId===drag.id) endDrag(); });
document.addEventListener('pointerup',e=>{
 if(touchUp(e)) return;
 if(!drag||e.pointerId!==drag.id) return;
 const d=drag; const wasActive=d.active; d.x=e.clientX; d.y=e.clientY;
 if(wasActive){
  if(d.ghost) d.ghost.style.display='none';
  const c=cellAt(d.x,d.y); const el=document.elementFromPoint(d.x,d.y);
  endDrag();
  if(c) place(d.mid,c.dataset.key);
  else if(d.kind==='cell'&&el&&el.closest('#listPane')) unplace(d.mid);
  return;
 }
 endDrag();
 if(d.tapCancel) return;
 tap(d);
});
function tap(d){
 if(d.kind==='blank') return; // ミスタップで選択が外れないよう、余白のタップでは解除しない
 if(d.kind==='row'){
  if(bulkMode){ if(bulkSel.has(d.mid)) bulkSel.delete(d.mid); else bulkSel.add(d.mid); renderList(); return; }
  if(sel!==d.mid){ sel=d.mid; renderAll(); } return;
 }
 // cell
 if(sel){
  if(S.placements[d.key]===sel) return;
  const id=sel; sel=null; place(id,d.key); return;
 }
 if(d.mid){ sel=d.mid; renderAll(); return; }
 openCellPicker(d.key);
}
function openCellPicker(key){
 const ov=document.createElement('div'); ov.className='ov';
 const dl=document.createElement('div'); dl.className='dlg';
 dl.innerHTML='<h3>メンバーを配置</h3><input type="text" id="cpQ" placeholder="名前・チーム検索" style="width:100%">'+
  '<div class="cplist" id="cpList"></div><div class="dbtn"><button id="cpCancel">キャンセル</button></div>';
 document.body.appendChild(ov); ov.appendChild(dl);
 const listEl=dl.querySelector('#cpList'), qEl=dl.querySelector('#cpQ');
 function draw(){
  const q=qEl.value.normalize('NFKC').toLowerCase();
  const un=S.members.filter(m=>!placementOf(m.id));
  const filtered=q?un.filter(m=>(m.name+' '+m.team).normalize('NFKC').toLowerCase().includes(q)):un;
  listEl.innerHTML=filtered.length?filtered.map(m=>{
   const c=memberColor(m);
   return `<div class="mrow" data-mid="${m.id}"><span class="chip" style="background:${c};color:${textColor(c)}">${esc(shortOf(m))}</span><span class="mname">${esc(m.name)}<small>${esc(m.team)}</small></span></div>`;
  }).join(''):'<div class="stat">未配置メンバーがいません</div>';
 }
 draw();
 qEl.oninput=draw;
 const close=()=>{ ov.remove(); document.removeEventListener('keydown',kd,true); };
 const kd=e=>{ if(e.key==='Escape'){ e.stopPropagation(); close(); } };
 document.addEventListener('keydown',kd,true);
 const t0=Date.now(); // タップで開いた直後に届く同じタップの click で誤配置しないよう無視
 listEl.onclick=e=>{ if(Date.now()-t0<400) return; const row=e.target.closest('[data-mid]'); if(!row) return; close(); place(row.dataset.mid,key); };
 dl.querySelector('#cpCancel').onclick=close;
 qEl.focus();
}
